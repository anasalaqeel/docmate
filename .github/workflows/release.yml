name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version Tag to Release (e.g., v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docmate_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 8000
      DATABASE_URL: postgres://postgres:password@localhost:5432/docmate_release_test
      AUTH_JWT_SECRET: ci-testing-jwt-secret-key-32-chars-long!
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: AdminPassword123!
      APP_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Frontend (Lint & Build)
        working-directory: ./frontend
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build

      - name: Validate Backend (Tests)
        working-directory: ./backend
        run: |
          bun install --frozen-lockfile
          bun run drizzle:push
          bun run drizzle:seed
          bun test

  create-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.tag }}
      is_prerelease: ${{ steps.resolve-tag.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version Tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.version }}"
            # Ensure "v" prefix
            if [[ ! "$RAW_TAG" =~ ^v ]]; then
              TAG="v$RAW_TAG"
            else
              TAG="$RAW_TAG"
            fi
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            TAG="${{ github.ref_name }}"
            # Detect prerelease from tag (e.g., v1.0.0-rc.1, v1.0.0-beta)
            if [[ "$TAG" =~ -(alpha|beta|rc|preview) ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            DRAFT="false"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "draft=$DRAFT" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with Auto Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: Release ${{ steps.resolve-tag.outputs.tag }}
          generate_release_notes: true
          draft: ${{ steps.resolve-tag.outputs.draft == 'true' }}
          prerelease: ${{ steps.resolve-tag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build & Publish Docker Images
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Prefix & Metadata
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_OWNER=ghcr.io/$OWNER" >> $GITHUB_ENV
          echo "TAG=${{ needs.create-release.outputs.release_tag }}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${{ needs.create-release.outputs.is_prerelease }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend Docker image metadata & build
      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docmate-backend
            ${{ env.GHCR_OWNER }}/docmate-backend
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.IS_PRERELEASE != 'true' }}
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Docker image metadata & build
      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docmate-frontend
            ${{ env.GHCR_OWNER }}/docmate-frontend
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.IS_PRERELEASE != 'true' }}
            type=sha,format=short

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
