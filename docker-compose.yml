services:
  database:
    image: postgres:18-alpine
    container_name: grud-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: grud
    ports:
      - "5432:5432"
    volumes:
      - grud-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: grud-backend
    environment:
      PORT: 8000
      DATABASE_URL: postgres://postgres:password@database:5432/grud
      AUTH_JWT_SECRET: your_jwt_secret_here
      CORS_ORIGINS: http://localhost:5173,http://localhost
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/v1
    container_name: grud-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  grud-db-data:
